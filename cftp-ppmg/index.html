<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Plataforma de estudos independente para o CFTP da Polícia Penal de MG.">
<title>CFTP PPMG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral azul-marinho fixa + área principal clara; leitor de resumos em "papel" branco */
:root{
  --bg:#f3f6fb; --panel:#ffffff; --panel2:#f6f8fc; --line:#dfe6f0; --line2:#c9d4e4;
  --fg:#0f1f3a; --muted:#5b6b84; --faint:#8a98ad;
  --gold:#1f5fd1; --gold2:#1d56bd; --gold-ink:#ffffff; --blue-soft:#e8f0fd;
  --navy:#0a2350; --navy2:#0e2f6b;
  --ok:#14804a; --okbg:#e7f6ee; --bad:#c43a2c; --badbg:#fdecea; --warn:#b7791f;
  --paper:#ffffff; --ink:#14213a; --ink2:#4b5a72; --rule:#dfe6f0;
  --c-mac:#fdf3c4; --c-mac-b:#c9a72e; --c-peg:#fbe0dc; --c-peg-b:#c0392b; --c-ibgp:#dfeafa; --c-ibgp-b:#2a6fc2; --c-pri:#ddf2e6; --c-pri-b:#138a60;
  --fd:"Archivo","Arial Narrow",system-ui,sans-serif; --fb:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
a{color:var(--gold2)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;background:linear-gradient(180deg,var(--navy2),var(--navy));color:#dbe5f5;padding:20px 14px 18px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px;text-decoration:none;color:#fff}
.brand img{width:46px;height:auto;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.brand b{font-family:var(--fd);font-size:22px;letter-spacing:.02em;font-weight:800;display:block;line-height:1.05}
.brand b span{color:#8fb6ff}
.brand small{display:block;font-size:9.5px;letter-spacing:.2em;color:#a9bbd8;text-transform:uppercase;margin-top:3px}
.navlabel{font-size:10.5px;letter-spacing:.2em;color:#8ea3c6;text-transform:uppercase;padding:0 8px}
nav.menu{display:flex;flex-direction:column;gap:2px}
nav.menu a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:#d3def0;text-decoration:none;font-size:14.5px;border:1px solid transparent}
nav.menu a svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
nav.menu a:hover{background:rgba(255,255,255,.07)}
nav.menu a.on{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.18);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #8fb6ff}
nav.menu a .ct{margin-left:auto;font-size:11px;color:#fff;background:#c43a2c;border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums}
.sidecard{margin-top:auto;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:12px;background:rgba(255,255,255,.06)}
.sidecard .k{font-size:10px;letter-spacing:.2em;color:#8fb6ff;text-transform:uppercase}
.sidecard p{margin:6px 0 0;font-size:12.5px;color:#c7d4ea}
.who{display:flex;gap:10px;align-items:center;margin-top:8px}
.who img{width:30px;height:30px;border-radius:50%;flex:none;background:#fff}
.who b{font-size:13px;color:#fff;display:block;line-height:1.2}
.disclaimer{font-size:10.5px;color:#8ea3c6;line-height:1.4;padding:0 6px}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#8ea3c6;margin-right:6px;vertical-align:middle}
.syncdot.ok{background:#4ade80} .syncdot.local{background:#fbbf24}
.topbar{display:none}
main{min-width:0;padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
h1,h2,h3{font-family:var(--fd);text-wrap:balance;margin:0;letter-spacing:.005em;color:var(--fg)}
h1{font-size:30px;font-weight:800} h2{font-size:20px;font-weight:700} h3{font-size:16px;font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid var(--line2);background:#fff;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.gold:hover{background:#174bb0;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 1px 2px rgba(15,31,58,.04)}
.hero{position:relative;overflow:hidden;border-radius:14px;background:radial-gradient(120% 140% at 85% 10%,#2c6be0 0,#1747a6 45%,#0d2c6a 100%);color:#fff;padding:34px 34px 30px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:center}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 16px);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:36px;line-height:1.08;color:#fff}
.hero .eyebrow{color:#b9d0ff}
.hero p{color:#dbe6fb;max-width:56ch;margin:10px 0 18px}
.hero .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.hero .btn.gold{background:#fff;border-color:#fff;color:var(--navy)}
.ring{justify-self:end;width:190px;height:190px;position:relative}
.ring svg{width:100%;height:100%}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .lbl b{font-family:var(--fd);font-size:34px;font-variant-numeric:tabular-nums}
.ring .lbl span{font-size:11px;letter-spacing:.14em;color:#c8d8f7;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat b{display:block;font-family:var(--fd);font-size:26px;font-variant-numeric:tabular-nums;color:var(--fg)}
.stat span{font-size:12.5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:10px;background:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--fg)}
.tile:hover{border-color:var(--gold);background:#f9fbff}
.tile svg{width:24px;height:24px;stroke:var(--gold);fill:none;stroke-width:1.6;flex:none}
.tile b{display:block;font-size:15px}
.tile span{font-size:12.5px;color:var(--muted)}
.tile i{margin-left:auto;font-style:normal;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.dcard{display:flex;flex-direction:column;border-radius:12px;border:1px solid var(--line);background:var(--panel);overflow:hidden;text-decoration:none;color:var(--fg)}
.dcard:hover{border-color:var(--gold);box-shadow:0 4px 14px rgba(31,95,209,.10)}
.dban{height:92px;position:relative;padding:12px 14px;display:flex;align-items:flex-end;justify-content:space-between;background:linear-gradient(135deg,var(--e1),var(--e2));}
.dban::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 14px)}
.dban .code{font-family:var(--fd);font-weight:800;font-size:40px;line-height:1;color:rgba(255,255,255,.95);position:relative;z-index:1}
.dban .ex{position:relative;z-index:1;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.88);text-align:right;max-width:60%}
.dbody{padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.dbody h3{font-size:15.5px;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:3px 8px;border-radius:99px;border:1px solid var(--line2);color:#33445f;background:#fff;white-space:nowrap}
.chip.alta{border-color:#f0b4ac;color:#a12d21;background:#fdecea}
.chip.media{border-color:#ecd28e;color:#7a5a07;background:#fdf6e1}
.chip.baixa{border-color:#a9dcc0;color:#11663c;background:#e7f6ee}
.bar{height:6px;border-radius:9px;background:#e3e9f3;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:9px}
.bar.ok i{background:var(--ok)}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{flex:1}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.tbl th{text-align:left;font-weight:700;color:#fff;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:10px 12px;background:var(--navy2);border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl tr.ex td{background:var(--blue-soft);color:var(--navy2);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
table.tbl td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.tbl tr:hover td{background:#f7faff}
table.tbl tr.ex:hover td{background:var(--blue-soft)}
table.tbl a{color:var(--fg);text-decoration:none;font-weight:600}
table.tbl a:hover{color:var(--gold2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--gold2);border-color:var(--gold)}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
select,input[type=search],input[type=number],input[type=text]{background:#fff;border:1px solid var(--line2);color:var(--fg);border-radius:8px;padding:9px 10px;font:inherit;font-size:14px;width:100%;min-width:0}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;gap:6px;align-items:center;font-size:13px;padding:6px 10px;border:1px solid var(--line2);border-radius:8px;cursor:pointer;background:#fff}
.checks input{accent-color:var(--gold)}
.qbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.qhead .src{font-size:12.5px;color:var(--muted)}
.qtag{font-size:11px;padding:3px 8px;border-radius:6px;background:#fdf6e1;color:#7a5a07;border:1px solid #ecd28e;font-weight:600}
.qtag.quiz{background:var(--blue-soft);color:var(--gold2);border-color:#bcd0f3}
.qstem{font-size:15.5px;line-height:1.62}
.qstem p{margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line2);background:#fff;cursor:pointer;line-height:1.5;width:100%}
.opt:hover:not([disabled]){border-color:var(--gold);background:#f9fbff}
.opt .L{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:1px solid var(--line2);background:var(--panel2)}
.opt.sel{border-color:var(--gold)} .opt.sel .L{background:var(--gold);color:#fff;border-color:var(--gold)}
.opt.right{border-color:var(--ok);background:var(--okbg)} .opt.right .L{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)} .opt.wrong .L{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.verdict{font-weight:700;display:flex;gap:8px;align-items:center}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.comment{border-top:1px solid var(--line);padding-top:14px;font-size:14.5px;line-height:1.6;color:#22324d}
.comment ul{padding-left:20px;margin:6px 0}
.comment p{margin:6px 0}
.qnav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dots button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line2);background:#fff;font-size:11px;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--muted)}
.dots button.cur{border-color:var(--gold);color:var(--gold2);font-weight:700}
.dots button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.dots button.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.dots button.ans{background:var(--blue-soft);border-color:#9dbcf0;color:var(--gold2)}
[data-custom-style="Macete"],[data-custom-style="Pegadinha"],[data-custom-style="IBGP"],[data-custom-style="Prisao"]{border-radius:8px;padding:10px 14px;margin:12px 0;border-left:4px solid}
[data-custom-style="Macete"]{background:var(--c-mac);border-color:var(--c-mac-b)}
[data-custom-style="Pegadinha"]{background:var(--c-peg);border-color:var(--c-peg-b)}
[data-custom-style="IBGP"]{background:var(--c-ibgp);border-color:var(--c-ibgp-b)}
[data-custom-style="Prisao"]{background:var(--c-pri);border-color:var(--c-pri-b)}
[data-custom-style] p{margin:0;max-width:none}
.reader{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start}
.toc{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));max-height:calc(100vh - 110px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.toc a{display:block;padding:6px 8px;border-radius:6px;color:#22324d;text-decoration:none;font-size:13px;line-height:1.35}
.toc a.h2{padding-left:20px;font-size:12.5px;color:var(--muted)}
.toc a:hover{background:var(--blue-soft);color:var(--gold2)}
.paper{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:34px clamp(18px,4vw,48px);font-size:15.5px;line-height:1.65;min-width:0;box-shadow:0 1px 3px rgba(15,31,58,.05)}
.paper h1{font-size:24px;color:var(--navy2);border-bottom:2px solid var(--gold);padding-bottom:6px;margin:34px 0 14px}
.paper h1:first-of-type{margin-top:8px}
.paper h2{font-size:19px;color:#1e4a8e;margin:26px 0 10px}
.paper h3{font-size:16px;color:#1e4a8e;margin:20px 0 8px}
.paper p{margin:0 0 12px;max-width:78ch}
.paper ul,.paper ol{padding-left:22px;margin:0 0 12px}
.paper li{margin:3px 0}
.paper img{display:block;max-width:100%;height:auto;margin:16px auto;border-radius:6px;border:1px solid var(--rule);background:#fff}
.paper table{border-collapse:collapse;width:100%;font-size:13.5px;margin:12px 0 18px;display:block;overflow-x:auto}
.paper th{background:var(--navy2);color:#fff;text-align:left;padding:8px 10px;font-weight:600;vertical-align:top}
.paper td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.paper tr:nth-child(even) td{background:#f2f6fc}
.paper a{color:var(--gold2)}
.readbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.fc{perspective:1200px;max-width:720px;width:100%;margin:0 auto}
.fcin{position:relative;min-height:260px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fcin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:1px solid var(--line2);padding:28px;display:flex;flex-direction:column;justify-content:center;gap:10px;background:#fff;box-shadow:0 6px 20px rgba(15,31,58,.07)}
.face.back{transform:rotateY(180deg);background:#eef4fe;border-color:#bcd0f3}
.face .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.face .t{font-size:20px;font-family:var(--fd);line-height:1.3}
.face.back .t{font-family:var(--fb);font-size:17px;line-height:1.55}
@media (prefers-reduced-motion:reduce){.fcin{transition:none}}
.boxes{display:flex;gap:6px}
.boxes span{flex:1;text-align:center;font-size:11px;color:var(--muted);padding:6px;border-radius:6px;border:1px solid var(--line);background:#fff;font-variant-numeric:tabular-nums}
.timer{font-family:var(--fd);font-size:22px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.vlist{display:flex;flex-direction:column;gap:8px}
.vitem{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);line-height:1.5}
.vitem .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--badbg);color:var(--bad);display:grid;place-items:center;font-size:12px;font-weight:700}
.empty{padding:28px;border:1px dashed var(--line2);border-radius:12px;text-align:center;color:var(--muted);background:#fff}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:1px solid #f0b4ac;background:var(--badbg);border-radius:10px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:13px}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.loading{padding:40px;text-align:center;color:var(--muted)}
.toast{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;z-index:80;box-shadow:0 8px 30px rgba(10,35,80,.3)}
/* controle de estudos (edital esquematizado) */
table.ctl td{vertical-align:middle;padding:8px 8px}
table.ctl th{text-align:center} table.ctl th:nth-child(1),table.ctl th:nth-child(2){text-align:left}
.st{display:inline-flex;align-items:center;justify-content:center;min-width:84px;padding:5px 7px;border-radius:7px;border:1px solid var(--line2);background:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;color:#33445f}
.st:hover{border-color:var(--gold)}
.st.s1{background:#fff7e0;border-color:#ecd28e;color:#7a5a07}
.st.s2{background:var(--okbg);border-color:#8fd0ad;color:var(--ok)}
.st.s2::before{content:"✓";margin-right:5px}
.st.na{background:transparent;border:1px dashed var(--line);color:var(--faint);cursor:default;font-weight:500}
.obs{min-width:150px;font-size:12.5px;padding:6px 8px}
.rowpct{font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.legend .st{min-width:0;cursor:default}
.ctlcards{display:none}
@media (max-width:1020px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .reader{grid-template-columns:minmax(0,1fr)} .toc{position:static;max-height:260px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:276px;height:100%;z-index:70;transform:translateX(-100%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(10,20,40,.5)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:50;align-items:center;gap:12px;background:var(--navy);color:#fff;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar button{background:none;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 10px;cursor:pointer;color:#fff}
  .topbar img{width:28px;height:auto}
  main{padding-block:20px 50px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hero{grid-template-columns:minmax(0,1fr);padding:24px}
  .hero h1{font-size:28px}
  .ring{justify-self:start;width:150px;height:150px}
  .tiles{grid-template-columns:minmax(0,1fr)}
  .filters{grid-template-columns:minmax(0,1fr)}
  .hb{grid-template-columns:minmax(0,1fr) 70px}.hb .bar{grid-column:1/-1;order:3}
  h1{font-size:25px}
  .ctltable{display:none}.ctlcards{display:flex;flex-direction:column;gap:10px}
  .readbar{top:calc(46px + env(safe-area-inset-top,0px))}
}
.ccard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ccard .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ccard .grid label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.ccard .st{min-width:0;width:100%}
.ceixo{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--navy2);margin-top:6px}
</style>
</head>

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- dados ---------- */
let META=null,Q=null,REV=null,QBY={};
const RCACHE={};
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(u);return r.json()}
const discName=c=>{const d=META.discs.find(x=>x.code===c);return d?d.name:(c==='P10'?'Técnicas de Escolta':c)};
const shortName=c=>{const n=discName(c);return n.length>46?n.slice(0,44)+'…':n};
const EIXO_COLORS={1:['#1f5fd1','#0e2f6b'],2:['#2b4c9a','#14244f'],3:['#1d7a8c','#0d3f4f'],4:['#3d4fb8','#1a2366'],5:['#2f8a63','#124a35'],6:['#5a55c9','#28246b'],7:['#1e6aa8','#0b3157'],P:['#4b5d7a','#1f2b40']};
function eixoNum(e){const m=/EIXO (\d)/.exec(e||'');return m?m[1]:(/PRESENC/.test(e||'')?'P':'?')}
function eixoLabel(e){const m=/EIXO (\d) — ([^(]+)/.exec(e||'');return m?`Eixo ${m[1]} · ${m[2].trim().toLowerCase()}`:(/PRESENC/.test(e||'')?'Presenciais':'')}

/* ---------- estado do aluno (db privado por pessoa, com reserva no navegador) ---------- */
const ST={answers:{},reads:{},cards:{},sims:{list:[]},ctl:{}};
const DOCS=['answers','reads','cards','sims','ctl'];
let OWNER=false,ME=null,INITDONE=false;
let DB=null,UID=null,mode='local';
const pend={},busy={},timers={};
function lsGet(k){try{return JSON.parse(localStorage.getItem('rota_'+k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem('rota_'+k,JSON.stringify(v))}catch(e){}}
function save(k){
  lsSet(k,ST[k]);
  if(!DB||!UID)return;
  pend[k]=true;clearTimeout(timers[k]);timers[k]=setTimeout(()=>flush(k),1200);
}
async function flush(k){
  if(busy[k]||!pend[k])return;busy[k]=true;pend[k]=false;
  try{await DB.collection('data/users/'+UID).doc(k).set(ST[k])}catch(e){setSync('erro')}
  busy[k]=false;if(pend[k])flush(k);
}
function setSync(s){

  ${META.discs.filter(d=>byD[d.code]).sort((a,b)=>dOrd(a.code)-dOrd(b.code)).map(d=>byD[d.code].map((r,i)=>`<tr><td>${i?'':`<b>${esc(d.code)}</b> · ${esc(shortName(d.code))}`}</td><td><a href="#resumo-${r.id}">${esc(r.title)}</a></td><td class="num">${r.secs}</td><td>${ST.reads[r.id]?'<span class="chip baixa">Lido</span>':'<span class="chip">A ler</span>'}</td></tr>`).join('')).join('')}

VIEWS.resumo=async(id)=>{

  <div class="reader"><nav class="toc" id="toc"><div class="loading" style="padding:10px">…</div></nav><article class="paper" id="paper"><div class="loading" style="color:var(--ink2)">Abrindo o resumo…</div></article></div>`;
  $('#markRead').onclick=()=>{if(ST.reads[id])delete ST.reads[id];else{ST.reads[id]=now();ctlUp(r.disc,'resumo')}save('reads');$('#markRead').textContent=ST.reads[id]?'Lido ✓':'Marcar como lido';$('#markRead').classList.toggle('gold',!ST.reads[id]);toast(ST.reads[id]?'Resumo marcado como lido':'Marcação removida')};

  }catch(e){$('#paper').innerHTML='<p>Não foi possível abrir este resumo agora. Verifique a conexão e tente de novo.</p>'}

/* ---------- Questões: filtros ---------- */
const QF={disc:'',src:'',tipo:'',status:''};
VIEWS.questoes=()=>{
  const discOpts=META.discs.filter(d=>Q.some(q=>q.disc===d.code)).concat(Q.some(q=>q.disc==='P10')&&!META.discs.some(d=>d.code==='P10')?[{code:'P10',name:'Técnicas de Escolta'}]:[]);
  $('#main').innerHTML=`<div><div class="eyebrow">${Q.length} questões comentadas</div><h1 style="margin-top:8px">Questões</h1><p class="muted" style="margin:8px 0 0;max-width:70ch">Reais das provas T1, T2 e T3, inéditas no nível da banca e as dos quizzes da plataforma. Escolha os filtros, responda e veja o comentário de cada alternativa na hora.</p></div>
  <section class="panel" style="display:flex;flex-direction:column;gap:14px"><div class="filters">
   <label class="f">Disciplina<select id="fDisc"><option value="">Todas</option>${discOpts.map(d=>`<option value="${d.code}">${esc(d.code+' · '+d.name)}</option>`).join('')}</select></label>
   <label class="f">Fonte<select id="fSrc"><option value="">Todas as fontes</option></select></label>
   <label class="f">Tipo<select id="fTipo"><option value="">Todos</option><option value="real">Reais das provas (T1, T2, T3)</option><option value="inedita">Inéditas</option><option value="quiz">Quizzes da plataforma</option></select></label>
   <label class="f">Situação<select id="fStatus"><option value="">Todas</option><option value="novas">Não respondidas</option><option value="erradas">Erradas</option><option value="certas">Acertadas</option></select></label>
  </div><div class="row" style="justify-content:space-between"><span id="fCount" class="muted"></span><div class="row"><label class="checks"><label><input type="checkbox" id="fShuf"> Embaralhar</label></label><button class="btn gold" id="fGo">Começar</button></div></div></section>
  <section style="display:flex;flex-direction:column;gap:10px"><h2>Por fonte</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>Fonte</th><th>Disciplina</th><th>Questões</th><th>Resolvidas</th><th>Acerto</th></tr></thead><tbody>
  ${META.srcs.map(s=>{const st=stats(q=>q.src===s[0]);return `<tr><td><a href="#treino-src.${s[0]}">${esc(s[1])}</a></td><td class="muted">${esc(s[2])}</td><td class="num">${st.tot}</td><td class="num">${st.done}</td><td class="num">${st.done?st.acc+'%':'–'}</td></tr>`}).join('')}
  </tbody></table></div></section>`;
  const fill=()=>{
    const ss=META.srcs.filter(s=>!QF.disc||s[2]===QF.disc);
    $('#fSrc').innerHTML='<option value="">Todas as fontes</option>'+ss.map(s=>`<option value="${s[0]}">${esc(s[1])}</option>`).join('');
    if(!ss.some(s=>s[0]===QF.src))QF.src='';
    $('#fSrc').value=QF.src;$('#fDisc').value=QF.disc;$('#fTipo').value=QF.tipo;$('#fStatus').value=QF.status;
    $('#fCount').textContent=filtered().length+' questões com esses filtros';
  };
  const on=(id,k)=>$('#'+id).onchange=e=>{QF[k]=e.target.value;fill()};
  on('fDisc','disc');on('fSrc','src');on('fTipo','tipo');on('fStatus','status');

  fill();
};
function isReal(q){return /\(T\d/.test(q.tag)}
function filtered(){
  return Q.filter(q=>{
    if(QF.disc&&q.disc!==QF.disc)return false;if(QF.src&&q.src!==QF.src)return false;
    if(QF.tipo==='real'&&!isReal(q))return false;if(QF.tipo==='quiz'&&q.tag!=='quiz')return false;if(QF.tipo==='inedita'&&(isReal(q)||q.tag==='quiz'))return false;
    const a=ST.answers[q.id];if(QF.status==='novas'&&a)return false;if(QF.status==='erradas'&&!(a&&!a[1]))return false;if(QF.status==='certas'&&!(a&&a[1]))return false;
    return true});
}

/* ---------- execução de questões (treino e prova) ---------- */
function startRun(list,mode,title,opts={}){
  RUN={list,mode,title,i:0,sel:{},done:{},start:Date.now(),limit:opts.limit||0,disc:opts.disc||'',src:opts.src||'',finished:false};
  if(mode==='prova'){location.hash='#prova-x'}else location.hash='#treino-x';
  if(route().arg==='x')render();
}
VIEWS.treino=(arg)=>{
  if(arg&&arg!=='x'){
    const [k,val]=arg.split('.');let l=[],t='';
    if(k==='src'){l=Q.filter(q=>q.src===val);const s=META.srcs.find(s=>s[0]===val);t=s?s[1]:val}
    else if(k==='disc'){l=Q.filter(q=>q.disc===val);t='Todas as questões · '+shortName(val)}
    else if(k==='real'){l=Q.filter(q=>q.disc===val&&isReal(q));t='Questões reais · '+shortName(val)}
    else if(k==='erros'){l=Q.filter(q=>{const a=ST.answers[q.id];return a&&!a[1]&&(!val||val==='all'||q.disc===val)});t='Caderno de erros'}
    if(!l.length){$('#main').innerHTML='<div class="empty">Nenhuma questão aqui ainda.</div>';return}
    RUN={list:l,mode:'treino',title:t,i:0,sel:{},done:{},start:Date.now()};
    history.replaceState(null,'','#treino-x');
  }
  if(!RUN){location.hash='#questoes';return}
  drawRun();
};
VIEWS.prova=()=>{if(!RUN||RUN.mode!=='prova'){location.hash='#simulados';return}drawRun()};
let TICK=null;
function drawRun(){
  clearInterval(TICK);
  const R=RUN,q=R.list[R.i],prova=R.mode==='prova';
  if(prova&&R.finished){return drawResult()}
  const answered=prova?R.sel[q.id]:R.done[q.id];
  const sel=R.sel[q.id];
  const tagHtml=q.tag==='quiz'?'<span class="qtag quiz">Quiz da plataforma</span>':(isReal(q)?`<span class="qtag">Prova ${esc(q.tag.replace(/[()]/g,''))}</span>`:'');
  $('#main').innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">${prova?'Simulado · modo prova':'Treino com comentário'}</div><h2 style="margin-top:6px">${esc(R.title)}</h2></div>
   <div class="row">${prova?`<span class="timer" id="timer"></span><button class="btn gold" id="finish">Entregar</button>`:`<a class="btn ghost sm" href="#questoes">Sair</a>`}</div></div>
  <div class="qbox"><div class="qhead"><span class="src">Questão ${R.i+1} de ${R.list.length} · ${esc(prova?shortName(q.disc):q.srcTitle)}</span><span class="row">${tagHtml}${q.ans==='ANULADA'?'<span class="qtag">Anulada</span>':''}</span></div>
   <div class="qstem">${q.stem}</div>
   <div class="opts">${q.opts.map(([L,t])=>{let c='';if(!prova&&answered){if(L===q.ans)c='right';else if(L===sel)c='wrong'}else if(L===sel)c='sel';return `<button class="opt ${c}" data-l="${L}" ${!prova&&answered?'disabled':''}><span class="L">${L}</span><span>${t}</span></button>`}).join('')}</div>
   ${!prova&&answered?`<div class="verdict ${q.ans==='ANULADA'?'':sel===q.ans?'ok':'bad'}">${q.ans==='ANULADA'?'Questão anulada na prova.':sel===q.ans?'✓ Você acertou.':'✕ Resposta certa: '+q.ans}</div>${q.com?`<div class="comment">${q.com}</div>`:''}`:''}
  </div>
  <div class="qnav"><button class="btn" id="prev" ${R.i?'':'disabled'}>← Anterior</button>
   <div class="dots">${R.list.length<=60?R.list.map((x,j)=>{let c=j===R.i?'cur ':'';if(prova){if(R.sel[x.id])c+='ans'}else if(R.done[x.id])c+=(R.sel[x.id]===x.ans?'ok':'bad');return `<button class="${c}" data-j="${j}">${j+1}</button>`}).join(''):`<span class="muted">${Object.keys(prova?R.sel:R.done).length} respondidas</span>`}</div>
   <button class="btn ${R.i<R.list.length-1?'gold':''}" id="next">${R.i<R.list.length-1?'Próxima →':(prova?'Entregar':'Concluir')}</button></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const L=b.dataset.l;R.sel[q.id]=L;
    if(!prova){R.done[q.id]=1;record(q,L)}
    drawRun();
  });
  document.querySelectorAll('.dots button').forEach(b=>b.onclick=()=>{R.i=+b.dataset.j;drawRun();window.scrollTo(0,0)});
  $('#prev').onclick=()=>{R.i--;drawRun();window.scrollTo(0,0)};
  $('#next').onclick=()=>{if(R.i<R.list.length-1){R.i++;drawRun();window.scrollTo(0,0)}else if(prova)finishProva();else{location.hash='#desempenho'}};
  if(prova){
    $('#finish').onclick=()=>finishProva();
    const tick=()=>{const el=$('#timer');if(!el){clearInterval(TICK);return}const used=Math.floor((Date.now()-R.start)/1000);
      if(R.limit){const left=R.limit*60-used;if(left<=0){finishProva();return}el.textContent=fmt(left);el.classList.toggle('low',left<300)}else el.textContent=fmt(used)};
    tick();TICK=setInterval(tick,1000);
  }
}
const fmt=s=>`${String(Math.floor(s/3600)).padStart(1,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function finishProva(){
  const R=RUN;if(R.finished)return;R.finished=true;clearInterval(TICK);
  let ok=0,valid=0;const per={};
  for(const q of R.list){if(q.ans==='ANULADA')continue;valid++;const L=R.sel[q.id];const hit=L===q.ans;if(hit)ok++;if(L)record(q,L);const p=per[q.disc]=per[q.disc]||[0,0];p[1]++;if(hit)p[0]++}
  R.score={ok,valid,secs:Math.floor((Date.now()-R.start)/1000),per};
  if(R.src&&R.src.startsWith('sim-')){const rr=META.resumos.find(x=>x.id===R.src.slice(4));if(rr)ctlUp(rr.disc,'sim')}
  ST.sims.list.push({t:now(),title:R.title,ok,n:valid,secs:R.score.secs});ST.sims.list=ST.sims.list.slice(-40);save('sims');
  drawResult();
}
function drawResult(){
  const R=RUN,s=R.score;
  $('#main').innerHTML=`<div><div class="eyebrow">Resultado do simulado</div><h1 style="margin-top:8px">${esc(R.title)}</h1></div>
  <div class="stats"><div class="stat"><b>${s.ok}/${s.valid}</b><span>acertos</span></div><div class="stat"><b>${pct(s.ok,s.valid)}%</b><span>de aproveitamento</span></div><div class="stat"><b>${fmt(s.secs)}</b><span>tempo gasto</span></div><div class="stat"><b>${Math.round(s.secs/Math.max(1,R.list.length))}s</b><span>por questão (a prova dá cerca de 2 min)</span></div></div>
  <section class="panel"><h3>Por disciplina</h3><div class="hbars" style="margin-top:12px">${Object.entries(s.per).map(([c,[a,b]])=>`<div class="hb"><span class="nm">${esc(shortName(c))}</span><div class="bar ${pct(a,b)>=70?'ok':''}"><i style="width:${pct(a,b)}%"></i></div><span class="v">${a}/${b} · ${pct(a,b)}%</span></div>`).join('')}</div></section>
  <div class="row"><button class="btn gold" id="rev">Revisar com comentários</button><a class="btn" href="#simulados">Novo simulado</a><a class="btn ghost" href="#erros">Caderno de erros</a></div>`;
  $('#rev').onclick=()=>{RUN={list:R.list,mode:'treino',title:'Revisão · '+R.title,i:0,sel:{...R.sel},done:Object.fromEntries(R.list.filter(q=>R.sel[q.id]).map(q=>[q.id,1])),start:Date.now()};location.hash='#treino-x';render()};
}

/* ---------- Caderno de erros ---------- */
VIEWS.erros=()=>{
  const wrong=Q.filter(q=>{const a=ST.answers[q.id];return a&&!a[1]});
  const by={};for(const q of wrong)(by[q.disc]=by[q.disc]||[]).push(q);
  $('#main').innerHTML=`<div><div class="eyebrow">Questões que você errou na última tentativa</div><h1 style="margin-top:8px">Caderno de erros</h1><p class="muted" style="margin:8px 0 0;max-width:70ch">Ao acertar uma questão ao refazer, ela sai do caderno automaticamente.</p></div>
  ${wrong.length?`<div class="row"><a class="btn gold" href="#treino-erros.all">Refazer as ${wrong.length} erradas</a></div>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>Disciplina</th><th>Erradas</th><th></th></tr></thead><tbody>${Object.entries(by).sort((a,b)=>b[1].length-a[1].length).map(([c,l])=>`<tr><td>${esc(discName(c))}</td><td class="num">${l.length}</td><td style="text-align:right"><a class="btn sm" href="#treino-erros.${c}">Refazer</a></td></tr>`).join('')}</tbody></table></div>
  <section style="display:flex;flex-direction:column;gap:10px"><h2>Últimos erros</h2><div class="vlist">${wrong.sort((a,b)=>ST.answers[b.id][4]-ST.answers[a.id][4]).slice(0,12).map(q=>`<div class="vitem"><span class="n">${esc(ST.answers[q.id][0])}</span><div style="min-width:0"><div class="muted" style="font-size:12px">${esc(q.srcTitle)} · questão ${q.n} · certa: ${q.ans}</div><div>${esc(strip(q.stem).slice(0,220))}${strip(q.stem).length>220?'…':''}</div></div></div>`).join('')}</div></section>`
  :'<div class="empty">Nenhum erro registrado. Resolva questões e as que você errar aparecem aqui para refazer.</div>'}`;
};

/* ---------- Flashcards ---------- */
let FC=null;
VIEWS.flashcards=async(code)=>{
  if(!REV){$('#main').innerHTML='<div class="loading">Carregando flashcards…</div>';REV=await getJSON('revisao.json');if(route().v!=='flashcards')return}
  const discs=[...new Set(REV.cards.map(c=>c.disc))];
  if(!code){
    $('#main').innerHTML=`<div><div class="eyebrow">${REV.cards.length} cartões tirados das tabelas de revisão dos resumos</div><h1 style="margin-top:8px">Flashcards</h1><p class="muted" style="margin:8px 0 0;max-width:70ch">Leia a frente, tente lembrar, vire o cartão e diga como foi. Os cartões que você erra voltam antes; os que você domina aparecem menos (caixas de 1 a 5).</p></div>
    <div class="row"><a class="btn gold" href="#flashcards-todos">Revisar cartões de todas as disciplinas</a></div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Disciplina</th><th>Cartões</th><th>Revisados</th><th>Dominados</th><th></th></tr></thead><tbody>${META.discs.filter(d=>discs.includes(d.code)).map(d=>{const c=cardStats(d.code);return `<tr><td><a href="#flashcards-${d.code}">${esc(d.name)}</a></td><td class="num">${c.tot}</td><td class="num">${c.seen}</td><td class="num">${c.known}</td><td style="text-align:right"><a class="btn sm" href="#flashcards-${d.code}">Revisar</a></td></tr>`}).join('')}</tbody></table></div>`;
    return;
  }
  const pool=REV.cards.filter(c=>code==='todos'||c.disc===code);
  if(!FC||FC.code!==code){const due=pool.slice().sort((a,b)=>(ST.cards[a.id]||0)-(ST.cards[b.id]||0)||Math.random()-.5);FC={code,list:due.slice(0,40),i:0,flip:false}}
  drawFC();
};
function drawFC(){
  const F=FC;if(F.i>=F.list.length){$('#main').innerHTML=`<div class="empty"><h2>Rodada concluída</h2><p>Você revisou ${F.list.length} cartões.</p><div class="row" style="justify-content:center"><button class="btn gold" id="again">Nova rodada</button><a class="btn" href="#flashcards">Outras disciplinas</a></div></div>`;$('#again').onclick=()=>{FC=null;render()};return}
  const c=F.list[F.i],box=ST.cards[c.id]||0;
  const counts=[1,2,3,4,5].map(b=>F.list.filter(x=>(ST.cards[x.id]||0)===b).length);
  $('#main').innerHTML=`<div class="row" style="justify-content:space-between"><div><a href="#flashcards" class="muted" style="font-size:13px;text-decoration:none">← Flashcards</a><h2 style="margin-top:6px">${F.code==='todos'?'Todas as disciplinas':esc(discName(F.code))}</h2></div><span class="muted">Cartão ${F.i+1} de ${F.list.length}</span></div>
  <div class="fc ${F.flip?'flip':''}" id="fc"><div class="fcin" style="min-height:280px"><div class="face"><div class="k">${esc(shortName(c.disc))} · caixa ${box||'nova'}</div><div class="t">${c.f}</div><div class="muted" style="font-size:12.5px;margin-top:auto">Toque para virar</div></div><div class="face back"><div class="k">Resposta</div><div class="t">${c.b}</div></div></div></div>
  <div class="row" style="justify-content:center">${F.flip?`<button class="btn" data-r="1" style="border-color:var(--bad)">Errei</button><button class="btn" data-r="2">Difícil</button><button class="btn gold" data-r="3">Acertei</button>`:`<button class="btn gold" id="flipb">Virar cartão</button>`}</div>
  <div class="boxes" style="max-width:720px;width:100%;margin:0 auto">${counts.map((n,i)=>`<span>Caixa ${i+1}: ${n}</span>`).join('')}</div>`;
  $('#fc').onclick=()=>{F.flip=!F.flip;drawFC()};
  const fb=$('#flipb');if(fb)fb.onclick=()=>{F.flip=true;drawFC()};
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=e=>{e.stopPropagation();const r=+b.dataset.r;const cur=ST.cards[c.id]||0;ST.cards[c.id]=r===1?1:r===2?Math.max(1,cur):Math.min(5,cur+1||2);save('cards');if(r===1)F.list.splice(Math.min(F.list.length,F.i+4),0,c);F.i++;F.flip=false;drawFC()});
}

/* ---------- Simulados ---------- */
VIEWS.simulados=(code)=>{
  const sets=META.srcs.filter(s=>s[0].startsWith('sim-'));
  const discOpts=META.discs.filter(d=>Q.some(q=>q.disc===d.code));
  const hist=ST.sims.list.slice().reverse().slice(0,8);
  $('#main').innerHTML=`<div><div class="eyebrow">Modo prova: sem gabarito até entregar</div><h1 style="margin-top:8px">Simulados</h1></div>
  <section class="panel" style="display:flex;flex-direction:column;gap:14px"><h3>Montar simulado</h3>
   <div class="checks" id="sDiscs">${discOpts.map(d=>`<label><input type="checkbox" value="${d.code}" ${code===d.code?'checked':''}> ${esc(d.code)} · ${esc(shortName(d.code))}</label>`).join('')}</div>
   <div class="filters"><label class="f">Questões<select id="sN"><option>10</option><option selected>20</option><option>30</option><option>50</option></select></label>
   <label class="f">Tempo<select id="sT"><option value="0">Sem limite</option><option value="20">20 min</option><option value="40" selected>40 min</option><option value="60">1 hora</option><option value="100">1h40 (50 questões)</option></select></label>
   <label class="f">Prioridade<select id="sP"><option value="">Todas as questões</option><option value="novas">Primeiro as não respondidas</option><option value="erradas">Primeiro as erradas</option></select></label>
   <label class="f">Tipo<select id="sK"><option value="">Todos</option><option value="sem-quiz">Sem os quizzes (nível de prova)</option><option value="real">Só reais das provas</option></select></label></div>
   <div class="row" style="justify-content:space-between"><span class="muted" style="font-size:13px">Sem nenhuma disciplina marcada, o simulado mistura todas, com mais peso nas que mais caem.</span><button class="btn gold" id="sGo">Iniciar simulado</button></div></section>
  <section style="display:flex;flex-direction:column;gap:10px"><h2>Simulados prontos</h2><div class="tiles">${sets.map(s=>`<button class="tile" style="text-align:left;cursor:pointer" data-s="${s[0]}">${ico('simulados')}<div><b>${esc(s[1].replace('Simulado de 30 – ',''))}</b><span>30 questões · 1 hora</span></div><i>›</i></button>`).join('')}</div></section>
  ${hist.length?`<section style="display:flex;flex-direction:column;gap:10px"><h2>Seus últimos simulados</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>Data</th><th>Simulado</th><th>Acertos</th><th>Tempo</th></tr></thead><tbody>${hist.map(h=>`<tr><td>${new Date(h.t*1000).toLocaleDateString('pt-BR')}</td><td>${esc(h.title)}</td><td class="num">${h.ok}/${h.n} · ${pct(h.ok,h.n)}%</td><td class="num">${fmt(h.secs)}</td></tr>`).join('')}</tbody></table></div></section>`:''}`;
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const s=META.srcs.find(x=>x[0]===b.dataset.s);startRun(Q.filter(q=>q.src===s[0]),'prova',s[1],{limit:60,src:s[0]})});
  $('#sGo').onclick=()=>{
    const ds=[...document.querySelectorAll('#sDiscs input:checked')].map(i=>i.value);const n=+$('#sN').value,lim=+$('#sT').value,p=$('#sP').value,k=$('#sK').value;
    let pool=Q.filter(q=>q.ans!=='ANULADA'&&(!ds.length||ds.includes(q.disc))&&(k!=='sem-quiz'||q.tag!=='quiz')&&(k!=='real'||isReal(q)));
    if(!pool.length){toast('Nenhuma questão com essas opções');return}
    const w=q=>{const a=ST.answers[q.id];let s=Math.random();if(p==='novas'&&!a)s+=2;if(p==='erradas'&&a&&!a[1])s+=2;if(!ds.length){const d=META.discs.find(x=>x.code===q.disc);s+=((d&&+d.q)||1)/7}return s};
    const pick=pool.map(q=>[w(q),q]).sort((a,b)=>b[0]-a[0]).slice(0,n).map(x=>x[1]);
    startRun(shuffle(pick),'prova',ds.length===1?'Simulado · '+shortName(ds[0]):(ds.length?`Simulado · ${ds.length} disciplinas`:'Simulado geral'),{limit:lim});
  };
};

/* ---------- Modo véspera ---------- */
VIEWS.vespera=async(code)=>{
  if(!REV){$('#main').innerHTML='<div class="loading">Carregando…</div>';REV=await getJSON('revisao.json');if(route().v!=='vespera')return}
  const discs=META.discs.filter(d=>REV.vesp.some(v=>v.disc===d.code));
  const cur=code||(discs[0]&&discs[0].code);
  const items=REV.vesp.filter(v=>v.disc===cur);
  const nums=REV.cards.filter(c=>c.disc===cur).slice(0,24);
  $('#main').innerHTML=`<div><div class="eyebrow">Última revisão antes da prova</div><h1 style="margin-top:8px">Modo véspera</h1><p class="muted" style="margin:8px 0 0;max-width:70ch">As pegadinhas mais prováveis de cada resumo e a tabela de números e nomes. Leia em voz alta e confira se você explica cada uma.</p></div>
  <label class="f" style="max-width:520px">Disciplina<select id="vD">${discs.map(d=>`<option value="${d.code}" ${d.code===cur?'selected':''}>${esc(d.code+' · '+d.name)}</option>`).join('')}</select></label>
  <div class="cols"><section style="display:flex;flex-direction:column;gap:10px"><h2>Pegadinhas mais prováveis (${items.length})</h2><div class="vlist">${items.map((v,i)=>`<div class="vitem"><span class="n">${i+1}</span><div style="min-width:0">${v.t}</div></div>`).join('')||'<div class="empty">Sem lista de pegadinhas para esta disciplina.</div>'}</div></section>
  <aside class="panel" style="display:flex;flex-direction:column;gap:8px"><div class="eyebrow">Números e nomes</div>${nums.map(c=>`<div style="border-top:1px solid var(--line);padding-top:8px;font-size:13px"><div style="font-weight:600">${c.f}</div><div class="muted">${c.b}</div></div>`).join('')||'<span class="muted">—</span>'}</aside></div>`;
  $('#vD').onchange=e=>{location.hash='#vespera-'+e.target.value};
};

/* ---------- Desempenho ---------- */
let RESETASK=false;
VIEWS.desempenho=()=>{
  const s=stats();const rows=META.discs.map(d=>({d,s:discStats(d.code)})).filter(x=>x.s.tot);
  const sims=ST.sims.list.slice(-12);
  const maxW=380,h=120;
  const pts=sims.map((x,i)=>[sims.length>1?20+i*(maxW-40)/(sims.length-1):maxW/2,h-14-(pct(x.ok,x.n)/100)*(h-34)]);
  $('#main').innerHTML=`<div><div class="eyebrow">Seu desempenho</div><h1 style="margin-top:8px">Meu desempenho</h1></div>
  <div class="stats"><div class="stat"><b>${s.done}/${s.tot}</b><span>questões resolvidas</span></div><div class="stat"><b>${s.done?s.acc+'%':'–'}</b><span>de acerto geral</span></div><div class="stat"><b>${readCount().read}/${readCount().tot}</b><span>resumos lidos</span></div><div class="stat"><b>${ST.sims.list.length}</b><span>simulados feitos</span></div></div>
  <section class="panel"><h3>Acerto por disciplina</h3><p class="muted" style="margin:4px 0 14px;font-size:13px">Barra verde a partir de 70% de acerto. Ordenado pelas disciplinas que mais caem.</p><div class="hbars">${rows.sort((a,b)=>(+b.d.q||0)-(+a.d.q||0)).map(({d,s})=>`<div class="hb"><a class="nm" href="#disc-${d.code}" style="color:var(--fg);text-decoration:none">${esc(d.code)} · ${esc(d.name)}</a><div class="bar ${s.acc>=70?'ok':''}"><i style="width:${s.done?s.acc:0}%"></i></div><span class="v">${s.done?s.acc+'%':'–'} · ${s.done}/${s.tot}</span></div>`).join('')}</div></section>
  ${sims.length?`<section class="panel"><h3>Evolução nos simulados</h3><div style="overflow-x:auto"><svg viewBox="0 0 ${maxW} ${h}" style="width:100%;max-width:640px;height:auto;margin-top:10px"><line x1="10" x2="${maxW-10}" y1="${h-14-0.7*(h-34)}" y2="${h-14-0.7*(h-34)}" stroke="#c9d4e4" stroke-dasharray="4 4"/><text x="${maxW-12}" y="${h-18-0.7*(h-34)}" fill="#5b6b84" font-size="9" text-anchor="end">70%</text><polyline fill="none" stroke="#1f5fd1" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3}" fill="#1f5fd1"/>`).join('')}</svg></div></section>`:''}
  <section class="panel" style="display:flex;flex-direction:column;gap:10px"><h3>Backup do progresso</h3><p class="muted" style="margin:0;font-size:13px">O progresso fica salvo neste navegador. Baixe o backup para guardar ou levar para outro aparelho e restaure lá.</p><div class="row"><button class="btn" id="bkDown">Baixar backup</button><label class="btn" style="cursor:pointer">Restaurar backup<input type="file" id="bkUp" accept=".json,application/json" hidden></label></div></section>
  <section class="panel" style="display:flex;flex-direction:column;gap:10px"><h3>Zerar progresso</h3><p class="muted" style="margin:0;font-size:13px">Apaga respostas, leituras, simulados e o controle do edital deste navegador.</p><div id="rst">${RESETASK?`<div class="confirm"><span>Tem certeza? Isso não pode ser desfeito.</span><button class="btn sm" id="rNo">Cancelar</button><button class="btn sm" id="rYes" style="border-color:var(--bad);color:var(--bad)">Apagar tudo</button></div>`:`<button class="btn" id="rAsk">Zerar meu progresso</button>`}</div></section>`;
  $('#bkDown').onclick=()=>{const blob=new Blob([JSON.stringify({app:'cftp-ppmg',v:1,data:ST})],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='cftp-ppmg-progresso-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)};
  $('#bkUp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!=='cftp-ppmg')throw 0;for(const k of DOCS){if(j.data&&j.data[k])ST[k]=merge(k,ST[k],j.data[k]);save(k)}toast('Backup restaurado');render()}catch(err){toast('Arquivo de backup inválido')}};
  const a=$('#rAsk');if(a)a.onclick=()=>{RESETASK=true;render()};
  const n=$('#rNo');if(n)n.onclick=()=>{RESETASK=false;render()};
  const y=$('#rYes');if(y)y.onclick=()=>{RESETASK=false;ST.answers={};ST.reads={};ST.cards={};ST.sims={list:[]};ST.ctl={};DOCS.forEach(save);toast('Progresso apagado');render()};
};

/* ---------- inicialização ---------- */
(async()=>{
  try{
    [META,Q]=await Promise.all([getJSON('meta.json'),getJSON('questoes.json')]);
    getJSON('revisao.json').then(r=>{REV=r}).catch(()=>{});
    render();
  }catch(e){$('#main').innerHTML='<div class="empty">Não foi possível carregar o conteúdo. Recarregue a página.</div>'}
  initDB().finally(()=>{INITDONE=true;if(!DB)render()});
})();
})();
</script>
